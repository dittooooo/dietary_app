spring.application.name=dietary-app

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dietary_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
jwt.secret=${JWT_SECRET:DietaryAppSecretKeyForJWTAuthentication123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.upload.dir=uploads/avatars
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 組員提供的分析 API，例如：http://localhost:8081
app.partner.dietary.base-url=https://dietary-app-kwz0.onrender.com
app.partner.dietary.ask-path=/ask
app.partner.dietary.dish-nutrition-path=/dish-nutrition