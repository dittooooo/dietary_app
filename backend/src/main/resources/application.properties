spring.application.name=dietary-app

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=dietaryApp;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TkuProject

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.upload.dir=uploads/avatars
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB