spring.application.name=dietary-app

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=dietary_app;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

app.upload.dir=uploads/avatars
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 外部 dietary partner API 設定，預設指向本機服務
app.partner.dietary.base-url=http://127.0.0.1:8000
app.partner.dietary.ask-path=/ask
app.partner.dietary.dish-nutrition-path=/dish-nutrition
app.partner.dietary.connect-timeout-ms=${PARTNER_DIETARY_CONNECT_TIMEOUT_MS:10000}
app.partner.dietary.read-timeout-ms=${PARTNER_DIETARY_READ_TIMEOUT_MS:60000}

#?????
spring.profiles.active=local
