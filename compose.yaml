name: dietary-app
services:
  nutritionist:
    build:
      context: .
      dockerfile: docker/nutritionist.Dockerfile
    environment:
      APP_ENV: production
      NEO4J_URI: ${NEO4J_AGENT_URI:-bolt://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${NUTRITIONIST_MODEL:-gpt-5.6-luna}
      NUTRITION_AGENT_ENABLE_TEXT2CYPHER: ${NUTRITION_AGENT_ENABLE_TEXT2CYPHER:-true}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/nutritionist-agent/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      nutritionist: { condition: service_healthy }
    environment:
      DB_URL: ${BACKEND_DB_URL:-jdbc:sqlserver://host.docker.internal:1433;databaseName=dietaryApp;encrypt=true;trustServerCertificate=true}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
      APP_PARTNER_DIETARY_BASE_URL: http://nutritionist:8000
      APP_PARTNER_COMPANION_BASE_URL: http://companion:3000
    ports: ["127.0.0.1:8080:8080"]
    volumes: [uploads:/app/uploads]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl -s -o /dev/null --max-time 5 -X POST -H "Content-Type: application/json" -d ''{"email":"healthcheck@example.com","password":"Health1"}'' http://localhost:8080/api/login || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
  companion:
    build:
      context: .
      dockerfile: docker/companion.Dockerfile
    depends_on:
      backend: { condition: service_healthy }
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${COMPANION_MODEL:-gpt-4o-mini}
      COMPANION_API_PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  maf:
    build:
      context: .
      dockerfile: docker/maf.Dockerfile
    depends_on:
      backend: { condition: service_healthy }
      companion: { condition: service_healthy }
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${COMPANION_MODEL:-gpt-4o-mini}
      COMPANION_AGENT_API_URL: http://companion:3000
      DIETARY_AGENT_API_URL: http://backend:8080
      COMPANION_PROMPT_DIR: /app/companion/prompts
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:3001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  uploads:
