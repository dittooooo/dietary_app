services:
  graphrag-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphrag-dev
    working_dir: /app/workspace
    volumes:
      - ../workspace:/app/workspace
    env_file:
      - ../../.env
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NUTRITION_AGENT_TOP_N_ROWS=${NUTRITION_AGENT_TOP_N_ROWS:-80}
      - NUTRITION_AGENT_DISH_MATCH_THRESHOLD=${NUTRITION_AGENT_DISH_MATCH_THRESHOLD:-60}
      - NUTRITION_AGENT_GRAPH_QUERY_LIMIT=${NUTRITION_AGENT_GRAPH_QUERY_LIMIT:-1000}
    command: >
      sh -c "python -m pip install -r /app/workspace/src/nutritionist_agent/requirements.txt
      && python -m uvicorn src.nutritionist_agent.app:app --host 0.0.0.0 --port 8000"
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
